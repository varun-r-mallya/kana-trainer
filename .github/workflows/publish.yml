name: publish

# Publishes to crates.io when a tag like v0.1.0 is pushed.
# Requires the repo secret CARGO_REGISTRY_TOKEN.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        run: |
          v="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - run: cargo build --release --locked
      - name: Skip if this version is already on crates.io
        id: exists
        run: |
          name=kanatrain
          v="${GITHUB_REF_NAME#v}"
          code="$(curl -s -o /dev/null -w '%{http_code}' -A "$GITHUB_REPOSITORY" "https://crates.io/api/v1/crates/$name/$v")"
          echo "already=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: cargo publish --locked
        if: steps.exists.outputs.already != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
